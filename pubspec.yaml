name: zuraffa_minio
description: A maintained fork of the minio package - a pure Dart client for MinIO and Amazon S3 compatible object storage.
version: 0.2.5
repository: https://github.com/arrrrny/zuraffa_minio
issue_tracker: https://github.com/arrrrny/zuraffa_minio/issues
homepage: https://github.com/arrrrny/zuraffa_minio

environment:
  sdk: ^3.11.0

dependencies:
  buffer: ^1.2.3
  convert: ^3.1.2
  crypto: ^3.0.7
  http: ^1.6.0
  intl: ">=0.20.2 <0.21.0"
  meta: ^1.16.0
  mime: ">=2.0.0 <3.0.0"
  path: ^1.9.1
  # xml 7 is the reason this fork exists as a drop-in replacement: the
  # abandoned upstream pinned xml 6.4.2, which is past its support window.
  xml: ^7.0.0

dev_dependencies:
  html: ^0.15.4
  mostly_reasonable_lints: ^0.1.2
  test: ^1.33.0
