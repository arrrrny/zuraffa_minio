# Zuraffa-native package created by `zfa package create` (spec 025).
name: zuraffa_minio
description: "Zuraffa-native MinIO / S3-compatible client — SigV4 signing, bucket/object operations, usecases, auto-DI."
version: 0.1.1
repository: https://github.com/arrrrny/zuraffa_minio

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.7
  # ListObjectsV2 XML parsing (specs/001-zuraffa-minio FR-3). The window keeps
  # this package resolvable for consumers still on Dart 3.11/3.12: xml 7.1.0
  # requires Dart ^3.13.0, so narrowing to ^7.1.0 would silently raise this
  # package's effective SDK floor above the ^3.11.0 declared below.
  xml: '>=6.6.1 <8.0.0'
  zuraffa: ^7.0.0

dev_dependencies:
  test: ^1.33.0
