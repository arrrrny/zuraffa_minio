name: zuraffa_minio
description: A maintained fork of the minio package - a pure Dart client for MinIO and Amazon S3 compatible object storage.
version: 7.6.0
repository: https://github.com/arrrrny/zuraffa_minio
issue_tracker: https://github.com/arrrrny/zuraffa_minio/issues
homepage: https://github.com/arrrrny/zuraffa_minio

environment:
  sdk: ^3.11.0

dependencies:
  buffer: ^1.2.3
  convert: ^3.1.2
  crypto: ^3.0.7
  http: ^1.6.0
  intl: ">=0.20.2 <0.21.0"
  meta: ^1.16.0
  mime: ">=2.0.0 <3.0.0"
  path: ^1.9.1
  # xml 7 is the reason this fork exists as a drop-in replacement: the
  # abandoned upstream pinned xml 6.4.2, which is past its support window.
  # The 7.x line is what this fork is tested against and remains the floor
  # consumers get by default. The floor is relaxed down to 6.6.1 so graphs
  # that also pull `vector_graphics_compiler` (which caps xml at <=7.0.1 via
  # the flutter_svg -> universal_image -> zuraffa_ui path) resolve cleanly at
  # fleet 7.6.0 — a `^7.1.0` floor sat above vgc's 7.0.1 ceiling and made
  # zuraffa_minio + zuraffa_ui mutually unresolvable (issue #8). The xml API
  # this package uses (XmlDocument/XmlElement/XmlBuilder/findElements) is
  # stable across 6.6.x and 7.x.
  xml: ">=6.6.1 <8.0.0"

dev_dependencies:
  html: ^0.15.4
  mostly_reasonable_lints: ^0.1.2
  test: ^1.33.0

# Fleet-wide xml policy: pin the override to the tested 7.x line so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly. The
# declared range is now `>=6.6.1 <8.0.0` (issue #8) so the package co-resolves
# with vector_graphics_compiler's `<=7.0.1` cap; the override keeps the fleet on
# the tested 7.1.0 line by default.
dependency_overrides:
  xml: 7.1.0
