# Zuraffa-native package created by `zfa package create` (spec 025).
name: zuraffa_minio
description: "Zuraffa-native MinIO / S3-compatible client — SigV4 signing, bucket/object operations, usecases, auto-DI."
version: 0.1.0
repository: https://github.com/arrrrny/zuraffa_minio
publish_to: https://pub.zuzu.dev

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.7
  # Window keeps this package consumable while zuraffa still depends on the
  # abandoned minio package (xml ^6.4.2); narrows to ^7.0.1 once zuraffa
  # switches to zuraffa_minio / drops minio.
  xml: '>=6.6.1 <8.0.0'
  zuraffa: ^6.3.0

dev_dependencies:
  test: ^1.25.0

# Dev-only resolution aids (pub strips dependency_overrides on publish).
dependency_overrides:
  xml: 7.0.1
