name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      # MinIO's open source server is archived: the docker images are gone and
      # `dl.min.io` answers 410. The last release that ships a linux binary
      # is used instead, so the integration tests run against a real server.
      - name: Start MinIO
        run: |
          curl -fsSL -o /tmp/minio \
            https://github.com/minio/minio/releases/download/RELEASE.2025-04-22T22-12-26Z/minio.linux-amd64.RELEASE.2025-04-22T22-12-26Z
          chmod +x /tmp/minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            /tmp/minio server /tmp/minio-data \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not come up" >&2
          exit 1

      - run: dart pub get

      # The test concurrency is capped at 2 - see AGENTS.md.
      - run: dart test -j 2
        env:
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: "9000"
          MINIO_USE_SSL: "false"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_REGION: us-east-1
