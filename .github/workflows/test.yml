name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      # MinIO's open source server is archived: the docker images are gone and
      # `dl.min.io` answers 410. The last release that ships a binary is used
      # instead, so the integration tests run against a real server. The binary
      # is picked for the runner's platform, so the same workflow also runs on
      # a macOS runner - and through scripts/local_ci.sh on a developer machine.
      - name: Start MinIO
        run: |
          set -euo pipefail
          release=RELEASE.2025-04-22T22-12-26Z
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="minio.linux-amd64.$release" ;;
            Linux/aarch64 | Linux/arm64) asset="minio.linux-arm64.$release" ;;
            Darwin/x86_64) asset="minio.darwin-amd64.$release" ;;
            Darwin/arm64) asset="minio.darwin-arm64.$release" ;;
            *) echo "no MinIO binary for $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/minio \
            "https://github.com/minio/minio/releases/download/$release/$asset"
          chmod +x /tmp/minio
          xattr -d com.apple.quarantine /tmp/minio 2>/dev/null || true
          rm -rf /tmp/minio-data
          # The server keeps running for the later steps, so its output goes to
          # a file: a server that holds the step's output pipe keeps the step
          # itself from finishing.
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup /tmp/minio server /tmp/minio-data \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > /tmp/minio.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not come up" >&2
          exit 1

      - run: dart pub get

      # The test concurrency is capped at 2 - see AGENTS.md.
      - run: dart test -j 2
        env:
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: "9000"
          MINIO_USE_SSL: "false"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_REGION: us-east-1
